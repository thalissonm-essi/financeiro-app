<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Financeiro">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Financeiro</title>
<style>
  :root { --bg:#000; --card:rgba(255,255,255,.07); --card2:rgba(255,255,255,.11); --borda:rgba(255,255,255,.1);
          --txt:#f5f5f7; --sub:#8e8e93; --verde:#3ddc84; --verm:#ff5c5c; --azul:#3ddc84; --amar:#ffd60a;
          --topo:env(safe-area-inset-top); --base:env(safe-area-inset-bottom); }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  html, body { background:var(--bg); color:var(--txt); height:100%; overflow:hidden;
         font:16px/1.35 -apple-system, "SF Pro Text", Inter, system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  body::before { content:""; position:fixed; inset:0; z-index:-1;
         background:radial-gradient(700px 420px at 15% -5%, #0f3b2a 0%, transparent 60%),
                    radial-gradient(600px 400px at 110% 20%, #13261f 0%, transparent 55%); }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  .tela { position:absolute; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
          padding:calc(var(--topo) + 12px) 16px calc(var(--base) + 96px); display:none; }
  .tela.on { display:block; animation:entra .25s ease; }
  @keyframes entra { from { opacity:0; transform:translateY(6px); } }
  .wrap { max-width:560px; margin:0 auto; display:grid; gap:12px; }
  .cab { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; margin:8px 0 4px; }
  h1 { font-size:34px; font-weight:700; letter-spacing:-.025em; }
  .sub { color:var(--sub); font-size:13px; }
  .card { background:var(--card); border:1px solid var(--borda); border-radius:22px; padding:16px;
          backdrop-filter:blur(30px) saturate(170%); -webkit-backdrop-filter:blur(30px) saturate(170%); }
  .rot { color:var(--sub); font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .hero { font-size:44px; font-weight:700; letter-spacing:-.035em; margin:4px 0 2px; font-variant-numeric:tabular-nums; }
  .g2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .val { font-size:22px; font-weight:700; letter-spacing:-.02em; margin-top:2px; font-variant-numeric:tabular-nums; }
  .pos { color:var(--verde); } .neg { color:var(--verm); } .alerta { color:var(--amar); }
  .seg { display:flex; background:var(--card); border:1px solid var(--borda); border-radius:12px; padding:3px; }
  .seg button { flex:1; font-size:14px; font-weight:600; color:var(--sub); padding:7px 8px; border-radius:9px; }
  .seg button.on { background:var(--card2); color:var(--txt); }
  .mes { display:flex; align-items:center; gap:4px; font-weight:600; }
  .mes button { width:32px; height:32px; border-radius:16px; background:var(--card); font-size:18px; color:var(--azul); }
  .mes span { min-width:96px; text-align:center; }
  .item { display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--borda); }
  .item:first-child { border-top:0; }
  .ico { width:38px; height:38px; border-radius:12px; display:grid; place-items:center; font-size:18px; flex:none; background:var(--card2); }
  .item .meio { flex:1; min-width:0; }
  .item .meio b { display:block; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item .meio small { color:var(--sub); font-size:13px; }
  .item .v { font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .dia { color:var(--sub); font-size:13px; font-weight:600; margin:14px 4px 6px; text-transform:capitalize; }
  .chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; }
  .chips button { padding:7px 14px; border-radius:18px; background:var(--card); border:1px solid var(--borda);
                  font-size:14px; font-weight:600; color:var(--sub); white-space:nowrap; }
  .chips button.on { background:var(--txt); color:#000; }
  input[type=search] { width:100%; padding:10px 14px; border-radius:12px; border:1px solid var(--borda);
                       background:var(--card); color:var(--txt); font:inherit; outline:none; }
  .barra { display:grid; grid-template-columns:100px 1fr 92px; align-items:center; gap:10px; margin-top:12px; font-size:14px; }
  .barra .n { color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .barra .t { height:8px; background:rgba(255,255,255,.08); border-radius:4px; overflow:hidden; }
  .barra .t i { display:block; height:100%; border-radius:4px; }
  .barra .v { text-align:right; font-weight:600; font-variant-numeric:tabular-nums; }
  .fluxo { display:flex; align-items:flex-end; gap:8px; height:140px; margin-top:14px; }
  .fluxo > div { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; }
  .fluxo .par { display:flex; gap:3px; align-items:flex-end; height:100%; width:100%; justify-content:center; }
  .fluxo .par i { width:42%; border-radius:5px 5px 0 0; min-height:3px; }
  .fluxo span { color:var(--sub); font-size:11px; text-transform:capitalize; }
  .leg { display:flex; gap:14px; margin-top:10px; color:var(--sub); font-size:12px; }
  .leg i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:5px; }
  .vazio { color:var(--sub); padding:10px 0; text-align:center; }
  .tag { font-size:11px; font-weight:700; padding:2px 7px; border-radius:6px; background:rgba(255,214,10,.15); color:var(--amar); margin-left:6px; }
  nav { position:fixed; left:16px; right:16px; bottom:calc(var(--base) + 10px); max-width:420px; margin:0 auto;
        display:flex; justify-content:space-around; padding:8px; border-radius:30px;
        background:rgba(28,28,30,.78); border:1px solid var(--borda); box-shadow:0 10px 30px rgba(0,0,0,.5);
        backdrop-filter:blur(30px) saturate(180%); -webkit-backdrop-filter:blur(30px) saturate(180%); }
  nav button { display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; font-weight:600;
               color:var(--sub); flex:1; padding:4px 0; }
  nav button.on { color:#000; background:var(--verde); border-radius:22px; }
  nav svg { width:22px; height:22px; }
  .atual { position:fixed; top:calc(var(--topo) + 8px); left:50%; transform:translateX(-50%); font-size:12px; color:var(--sub);
           background:var(--card); padding:4px 10px; border-radius:10px; display:none; }
  .heroCard { background:linear-gradient(145deg, #12392b, #0b1f18); border:1px solid rgba(61,220,132,.18); border-radius:26px; padding:20px; }
  .acoes { display:flex; justify-content:space-between; margin-top:18px; }
  .acoes button { display:flex; flex-direction:column; align-items:center; gap:6px; font-size:12px; color:var(--sub); flex:1; }
  .acoes span { width:48px; height:48px; border-radius:24px; display:grid; place-items:center; font-size:20px; background:rgba(255,255,255,.1); }
  .acoes button:first-child span { background:var(--verde); }
  .contas { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .cc { border-radius:22px; padding:16px; color:#0b0b0b; min-height:118px; display:flex; flex-direction:column; justify-content:space-between; }
  .cc .rot { color:rgba(0,0,0,.55); } .cc .val { color:#0b0b0b; } .cc small { color:rgba(0,0,0,.6); font-size:12px; font-weight:600; }
  .semana { display:flex; align-items:flex-end; gap:8px; height:120px; margin-top:14px; }
  .semana div { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; }
  .semana i { width:100%; border-radius:8px; min-height:4px; background:rgba(255,255,255,.14); }
  .semana i.hoje { background:var(--verde); }
  .semana span { color:var(--sub); font-size:11px; }
  .rosca { width:170px; height:170px; border-radius:50%; margin:16px auto 4px; position:relative; }
  .rosca::after { content:""; position:absolute; inset:22px; border-radius:50%; background:#0d0d0f; }
  .rosca b { position:absolute; inset:0; display:grid; place-items:center; z-index:1; font-size:18px; text-align:center; line-height:1.2; }
  .erro { text-align:center; padding:40px 16px; color:var(--sub); }
</style>
</head>
<body>
<div class="atual" id="atual">Atualizando…</div>

<section class="tela on" id="t-inicio"><div class="wrap">
  <div class="cab"><div><div class="sub" id="ola"></div><h1>Início</h1></div>
    <div class="mes"><button data-m="-1">‹</button><span class="nomeMes"></span><button data-m="1">›</button></div></div>
  <div class="seg conta"><button data-c="" class="on">Tudo</button><button data-c="PF">Pessoal</button><button data-c="PJ">Empresa</button></div>
  <div class="heroCard"><div class="rot">Saldo do mês</div><div class="hero" id="saldo"></div>
    <div class="sub">Entrou <b class="pos" id="ent"></b> · Saiu <b class="neg" id="sai"></b></div>
    <div class="sub" style="margin-top:2px">Projetado com previstos: <b id="proj"></b></div>
    <div class="acoes">
      <button data-ir="lanc"><span>☰</span>Extrato</button><button data-ir="agenda"><span>📅</span>Agenda</button>
      <button data-ir="rel"><span>📊</span>Relatórios</button><button id="btBot"><span>💬</span>Lançar</button></div></div>
  <div class="contas" id="contas"></div>
  <div class="card"><div class="rot">Gastos dos últimos 7 dias</div><div class="semana" id="semana"></div></div>
  <div class="card"><div class="cab" style="margin:0"><div class="rot">Próximos vencimentos</div>
    <button class="sub" style="color:var(--azul)" data-ir="agenda">Ver tudo</button></div><div id="prox"></div></div>
  <div class="card"><div class="rot">Onde foi o dinheiro</div><div id="topcat"></div></div>
</div></section>

<section class="tela" id="t-lanc"><div class="wrap">
  <div class="cab"><h1>Lançamentos</h1>
    <div class="mes"><button data-m="-1">‹</button><span class="nomeMes"></span><button data-m="1">›</button></div></div>
  <input type="search" id="busca" placeholder="Buscar">
  <div class="chips" id="filtro"><button data-f="" class="on">Tudo</button><button data-f="Entrada">Entradas</button>
    <button data-f="Saída">Saídas</button><button data-f="Previsto">Previstos</button><button data-f="PF">Pessoal</button><button data-f="PJ">Empresa</button></div>
  <div id="lista"></div>
</div></section>

<section class="tela" id="t-agenda"><div class="wrap">
  <div class="cab"><h1>Agenda</h1></div>
  <div class="g2">
    <div class="card"><div class="rot">A pagar · 30 dias</div><div class="val neg" id="apagar"></div></div>
    <div class="card"><div class="rot">A receber · 30 dias</div><div class="val pos" id="areceber"></div></div>
  </div>
  <div id="agenda"></div>
</div></section>

<section class="tela" id="t-rel"><div class="wrap">
  <div class="cab"><h1>Relatórios</h1>
    <div class="mes"><button data-m="-1">‹</button><span class="nomeMes"></span><button data-m="1">›</button></div></div>
  <div class="seg conta"><button data-c="" class="on">Tudo</button><button data-c="PF">Pessoal</button><button data-c="PJ">Empresa</button></div>
  <div class="card"><div class="rot">Gastos por categoria</div><div class="rosca" id="rosca"></div><div id="cats"></div></div>
  <div class="card"><div class="rot">Fluxo · 6 meses</div><div class="fluxo" id="fluxo"></div>
    <div class="leg"><span><i style="background:var(--verde)"></i>Entradas</span><span><i style="background:var(--verm)"></i>Saídas</span></div></div>
  <div class="g2">
    <div class="card"><div class="rot">Fixas</div><div class="val" id="fix"></div><div class="sub" id="fixp"></div></div>
    <div class="card"><div class="rot">Variáveis</div><div class="val" id="var"></div><div class="sub" id="varp"></div></div>
  </div>
  <div class="card"><div class="rot">Pessoal × Empresa</div><div id="pfpj"></div></div>
</div></section>

<nav>
  <button data-t="inicio" class="on"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2.5 11h2.5v9h5v-6h4v6h5v-9h2.5z"/></svg>Início</button>
  <button data-t="lanc"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 5h16v2H4zm0 6h16v2H4zm0 6h10v2H4z"/></svg>Lançamentos</button>
  <button data-t="agenda"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 2h2v2h6V2h2v2h3v18H4V4h3zm-1 8v10h12V10zm2 2h3v3H8z"/></svg>Agenda</button>
  <button data-t="rel"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 20h16v2H4zM6 10h3v8H6zm5-6h3v14h-3zm5 9h3v5h-3z"/></svg>Relatórios</button>
</nav>

<script>
const API = "https://script.google.com/macros/s/AKfycbxNpFWczNkLQDocwOsRUT7JLKQahPh6LId1czQULDdkB4-vLmcZw_PhX6U3fuGtjfg/exec";
const ICO = { "Clientes":"💼", "Pró-labore":"🧾", "Outras entradas":"💰", "Moradia":"🏠", "Alimentação":"🍽️", "Transporte":"🚗",
  "Saúde":"💊", "Lazer":"🎉", "Assinaturas":"📺", "Equipamento":"🎥", "Impostos":"🏛️", "Marketing":"📣", "Dívidas":"💳",
  "Investimento":"📈", "Outros":"📦" };
const COR = ["#3ddc84", "#ffe27a", "#7ab8ff", "#ff8a8a", "#c7a6ff", "#64d2ff", "#ffb35c", "#8e8e93"];

const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
             set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const hashK = new URLSearchParams(location.hash.slice(1)).get("k");
if (hashK) { ls.set("k", hashK); history.replaceState(null, "", location.pathname); }
const KEY = hashK || ls.get("k");

const $ = id => document.getElementById(id);
const $$ = s => document.querySelectorAll(s);
const brl = v => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ym = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
const ymd = d => `${ym(d)}-${String(d.getDate()).padStart(2, "0")}`;
const nomeMes = (m, curto) => new Date(m + "-15T12:00").toLocaleDateString("pt-BR", curto ? { month: "short" } : { month: "long", year: "numeric" }).replace(".", "").replace(/^./, c => c.toUpperCase());
const nomeDia = s => new Date(s + "T12:00").toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
const soma = (a, f) => a.filter(f).reduce((s, l) => s + l.valor, 0);

let D = JSON.parse(ls.get("dados") || "[]"), conta = "", filtro = "", mes = ym(new Date()), tela = "inicio";
const hoje = ymd(new Date());

function linha(l) {
  const atrasado = l.status === "Previsto" && l.data < hoje;
  return `<div class="item"><div class="ico">${ICO[l.cat] || "📦"}</div><div class="meio"><b>${esc(l.desc)}</b>` +
    `<small>${l.data.split("-").reverse().slice(0, 2).join("/")} · ${esc(l.cat)} · ${l.conta}` +
    `${l.status === "Previsto" ? `<span class="tag">${atrasado ? "atrasado" : "previsto"}</span>` : ""}</small></div>` +
    `<div class="v ${l.tipo === "Entrada" ? "pos" : ""}">${l.tipo === "Entrada" ? "+" : "−"}${brl(l.valor)}</div></div>`;
}
const card = html => `<div class="card" style="padding:4px 16px">${html}</div>`;
const barras = (pares, total) => {
  const max = pares.length ? pares[0][1] : 1;
  return pares.map(([n, v], i) => `<div class="barra"><span class="n">${ICO[n] ? ICO[n] + " " : ""}${esc(n)}</span>` +
    `<span class="t"><i style="width:${v / max * 100}%;background:${COR[i % COR.length]}"></i></span>` +
    `<span class="v">${brl(v)}<br><small class="sub">${total ? Math.round(v / total * 100) + "%" : ""}</small></span></div>`).join("");
};

function render() {
  $$(".nomeMes").forEach(e => e.textContent = nomeMes(mes));
  const h = new Date().getHours();
  $("ola").textContent = (h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite") + ", Thalisson";
  const base = D.filter(l => !conta || l.conta === conta);
  const M = base.filter(l => l.data.startsWith(mes)), R = M.filter(l => l.status === "Realizado");
  const ent = soma(R, l => l.tipo === "Entrada"), sai = soma(R, l => l.tipo === "Saída");
  const pe = soma(M, l => l.status === "Previsto" && l.tipo === "Entrada"), ps = soma(M, l => l.status === "Previsto" && l.tipo === "Saída");

  // Início
  $("saldo").textContent = brl(ent - sai); $("saldo").className = "hero" + (ent - sai < 0 ? " neg" : "");
  $("proj").textContent = brl(ent - sai + pe - ps);
  $("ent").textContent = brl(ent); $("sai").textContent = brl(sai);
  const futuros = D.filter(l => l.status === "Previsto" && (!conta || l.conta === conta)).sort((a, b) => a.data.localeCompare(b.data));
  $("prox").innerHTML = futuros.slice(0, 4).map(linha).join("") || `<div class="vazio">Nada a vencer 🎉</div>`;
  const cats = {};
  R.filter(l => l.tipo === "Saída").forEach(l => cats[l.cat] = (cats[l.cat] || 0) + l.valor);
  const top = Object.entries(cats).sort((a, b) => b[1] - a[1]);
  $("topcat").innerHTML = barras(top.slice(0, 4), sai) || `<div class="vazio">Sem gastos neste mês.</div>`;

  const MR0 = D.filter(l => l.data.startsWith(mes) && l.status === "Realizado");
  $("contas").innerHTML = [["PF", "Pessoal", "#b8f5d0"], ["PJ", "Empresa", "#ffe27a"]].map(([c, n, cor]) => {
    const X = MR0.filter(l => l.conta === c), e = soma(X, l => l.tipo === "Entrada"), s = soma(X, l => l.tipo === "Saída");
    return `<div class="cc" style="background:${cor}"><div class="rot">${n}</div><div><div class="val">${brl(e - s)}</div>` +
      `<small>+${brl(e)} · −${brl(s)}</small></div></div>`; }).join("");
  const dias7 = [...Array(7)].map((_, i) => ymd(new Date(Date.now() - (6 - i) * 864e5)));
  const g7 = dias7.map(d => soma(base, l => l.data === d && l.tipo === "Saída" && l.status === "Realizado"));
  const m7 = Math.max(1, ...g7);
  $("semana").innerHTML = dias7.map((d, i) => `<div><i class="${d === hoje ? "hoje" : ""}" style="height:${g7[i] / m7 * 100}%" title="${brl(g7[i])}"></i>` +
    `<span>${new Date(d + "T12:00").toLocaleDateString("pt-BR", { weekday: "narrow" })}</span></div>`).join("");

  // Lançamentos
  const q = $("busca").value.trim().toLowerCase();
  const L = D.filter(l => l.data.startsWith(mes) && (!q || (l.desc + l.cat).toLowerCase().includes(q)) &&
    (!filtro || l.tipo === filtro || l.status === filtro || l.conta === filtro)).sort((a, b) => b.data.localeCompare(a.data));
  const dias = {};
  L.forEach(l => (dias[l.data] = dias[l.data] || []).push(l));
  $("lista").innerHTML = Object.entries(dias).map(([d, ls]) => `<div class="dia">${nomeDia(d)}</div>` + card(ls.map(linha).join(""))).join("")
    || `<div class="vazio">Nenhum lançamento.</div>`;

  // Agenda
  const lim = ymd(new Date(Date.now() + 30 * 864e5));
  const prox30 = futuros.filter(l => l.data <= lim);
  $("apagar").textContent = brl(soma(prox30, l => l.tipo === "Saída"));
  $("areceber").textContent = brl(soma(prox30, l => l.tipo === "Entrada"));
  const ag = {};
  futuros.forEach(l => (ag[l.data] = ag[l.data] || []).push(l));
  $("agenda").innerHTML = Object.entries(ag).map(([d, ls]) =>
    `<div class="dia">${d < hoje ? "⚠️ " : ""}${nomeDia(d)}</div>` + card(ls.map(linha).join(""))).join("")
    || `<div class="vazio">Nenhuma conta prevista. Mande "vou pagar 1500 de aluguel dia 10" pro bot.</div>`;

  // Relatórios
  let ac = 0;
  $("rosca").style.background = top.length ? "conic-gradient(" + top.map(([, v], i) => { const a = ac; ac += v / sai * 100;
    return `${COR[i % COR.length]} ${a}% ${ac}%`; }).join(",") + ")" : "rgba(255,255,255,.08)";
  $("rosca").innerHTML = `<b>${brl(sai)}<br><small class="sub">gasto</small></b>`;
  $("cats").innerHTML = barras(top, sai) || `<div class="vazio">Sem gastos realizados.</div>`;
  const [a, m] = mes.split("-").map(Number);
  const seis = [...Array(6)].map((_, i) => ym(new Date(a, m - 6 + i, 1)));
  const fl = seis.map(k => { const X = base.filter(l => l.data.startsWith(k) && l.status === "Realizado");
    return [k, soma(X, l => l.tipo === "Entrada"), soma(X, l => l.tipo === "Saída")]; });
  const fmax = Math.max(1, ...fl.flatMap(f => [f[1], f[2]]));
  $("fluxo").innerHTML = fl.map(([k, e, s]) => `<div><div class="par"><i style="height:${e / fmax * 100}%;background:var(--verde)"></i>` +
    `<i style="height:${s / fmax * 100}%;background:var(--verm)"></i></div><span>${nomeMes(k, 1)}</span></div>`).join("");
  const fix = soma(M, l => l.tipo === "Saída" && l.natureza === "Fixa"), vr = soma(M, l => l.tipo === "Saída" && l.natureza === "Variável");
  $("fix").textContent = brl(fix); $("var").textContent = brl(vr);
  $("fixp").textContent = fix + vr ? Math.round(fix / (fix + vr) * 100) + "% das saídas" : "";
  $("varp").textContent = fix + vr ? Math.round(vr / (fix + vr) * 100) + "% das saídas" : "";
  const MR = D.filter(l => l.data.startsWith(mes) && l.status === "Realizado");
  $("pfpj").innerHTML = ["PF", "PJ"].map(c => { const X = MR.filter(l => l.conta === c);
    const e = soma(X, l => l.tipo === "Entrada"), s = soma(X, l => l.tipo === "Saída");
    return `<div class="item"><div class="ico">${c === "PF" ? "👤" : "🏢"}</div><div class="meio"><b>${c === "PF" ? "Pessoal" : "Empresa"}</b>` +
      `<small>+${brl(e)} · −${brl(s)}</small></div><div class="v ${e - s < 0 ? "neg" : "pos"}">${brl(e - s)}</div></div>`; }).join("");
}

async function carregar() {
  if (!KEY) { document.body.innerHTML = `<div class="erro"><h1 style="color:var(--txt)">Financeiro</h1><p style="margin:12px 0">Cole a chave de acesso que o bot te mandou.</p>` +
    `<input type="search" id="chave" placeholder="Chave" style="margin-bottom:12px"><button id="entrar" style="background:var(--verde);color:#000;font-weight:700;padding:12px 24px;border-radius:14px">Entrar</button></div>`;
    document.getElementById("entrar").onclick = () => { ls.set("k", document.getElementById("chave").value.trim()); location.reload(); }; return; }
  $("atual").style.display = "block";
  try {
    const r = await fetch(`${API}?formato=json&k=${encodeURIComponent(KEY)}`);
    D = await r.json(); ls.set("dados", JSON.stringify(D)); render();
  } catch (e) { $("atual").textContent = "Sem conexão · mostrando últimos dados"; setTimeout(() => $("atual").style.display = "none", 2500); return; }
  $("atual").style.display = "none";
}

function irPara(t) {
  tela = t;
  $$(".tela").forEach(s => s.classList.toggle("on", s.id === "t-" + t));
  $$("nav button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  $("t-" + t).scrollTop = 0;
}
$$("nav button").forEach(b => b.onclick = () => irPara(b.dataset.t));
$$("[data-ir]").forEach(b => b.onclick = () => irPara(b.dataset.ir));
$$(".mes button").forEach(b => b.onclick = () => { const [a, m] = mes.split("-").map(Number); mes = ym(new Date(a, m - 1 + +b.dataset.m, 1)); render(); });
$$(".conta button").forEach(b => b.onclick = () => { conta = b.dataset.c;
  $$(".conta button").forEach(x => x.classList.toggle("on", x.dataset.c === conta)); render(); });
$$("#filtro button").forEach(b => b.onclick = () => { filtro = b.dataset.f;
  $$("#filtro button").forEach(x => x.classList.toggle("on", x === b)); render(); });
$("busca").oninput = render;
$("btBot").onclick = () => location.href = "https://t.me/thalisson_financeiro_bot";
document.addEventListener("visibilitychange", () => { if (!document.hidden) carregar(); });

render();
carregar();
</script>
